# NeoForge mod metadata. Placeholders are expanded from gradle.properties at build time.

# Mandatory on this game version and dropped again later, which is why the 26.x file carries neither: FML 4 refuses a
# file without them, and the refusal names the mod's first folder rather than this file — "build/classes/java/main is
# not a valid mod file" is what a missing modLoader looks like from the outside. The range is the loader's own major,
# the one NeoForge 21.1.x ships.
modLoader="javafml"
loaderVersion="[4,)"

# The license for the mod (mandatory).
license="${mod_license}"

# Lithium reads this file-level table (ModFileInfo.getConfigElement) and disables the
# named options itself. mixin.ai.poi overwrites the POI queries our seam folds inject
# into; the hierarchical key also covers .tasks and .fast_portals, whose redirects
# bypass any wrap on our side. game_events.dispatch replaces the chunk fetch in
# GameEventDispatcher.post with a lookup keyed by the raw enumerated coordinate, so a
# listener past the bounds is never visited.
["lithium:options"]
    "mixin.ai.poi" = false
    "mixin.world.game_events.dispatch" = false

# A list of mods.
[[mods]] #mandatory

# The modid of the mod.
modId="${mod_id}" #mandatory

# The version number of the mod.
version="${mod_version}" #mandatory

# A display name for the mod.
displayName="${mod_name}" #mandatory

# A file name (in the root of the mod JAR) containing a logo for display.
logoFile="logo.png"

# The authors of the mod, displayed in the mod UI.
authors="Anyttng"

# The description text for the mod (multi line!).
description='''
Circumnavigate the world — walk, sail or fly past the border and come out on the far side. No walls, no teleports, one seamless world.
'''

# NeoForge dependency.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Minecraft dependency.
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config="toroidal_world.mixins.json"

[[mixins]]
config="toroidal_world.shape.mixins.json"
