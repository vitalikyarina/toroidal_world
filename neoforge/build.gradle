plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

evaluationDependsOn(':common')

ext {
    mod_id = 'toroidal_world'
    mod_name = 'Toroidal World'
    mod_version = toroidal_world_version
}

version = mod_version
group = mod_group_id

def withBuildSuffix = { baseVersion ->
    def buildSuffix = findProperty("${mod_id}_build")
    buildSuffix ? "${baseVersion}-${buildSuffix}" : baseVersion
}
def modIngameVersion = withBuildSuffix(mod_version)
def jarVersion = withBuildSuffix("${mod_version}+mc${minecraft_version}")

base {
    archivesName = mod_id
}

// The final mod jar: this module's loader glue plus everything from common — classes, mixin configs, assets and the
// AT, which NeoForge discovers at META-INF/accesstransformer.cfg of the merged jar.
tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-neoforge-${jarVersion}.jar"
    from(project(':common').sourceSets.main.output)
}

repositories {
    // MixinSquared — the C2ME compat mixin injects into C2ME's own handler.
    maven {
        name = 'Bawnorton'
        url = 'https://maven.bawnorton.com/releases'
        content {
            includeGroup 'com.github.bawnorton.mixinsquared'
        }
    }
    // C2ME, for the AST classes the density-function fold test builds by hand.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

// Mojang ships Java 25 to end users, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // The AT moved to common with the mixins it serves; the dev runs of this module still have to apply it to the game.
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

    // Default run configurations.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
    }

    // Creates the test source set with the Minecraft classes on its classpath and runs tests through the FML JUnit
    // launcher, so registries are bootstrapped and the mod's mixins are applied. Only tests that need a loader live
    // here: packets read through accessor mixins, density-function samples whose expected values come from the noise
    // mixins, and the C2ME fold test — C2ME's own access transformer opens the NoiseChunk internals its AST walks.
    // Everything else runs as plain JUnit in common.
    unitTest {
        enable()
        testedMod = mods.toroidal_world
    }
}

dependencies {
    implementation project(':common')

    // Bundled rather than borrowed from C2ME's own jar-in-jar: that copy is C2ME's implementation detail, and leaning
    // on it would make the fold vanish the day C2ME drops or renames it. The open range is a floor, not a pin — where
    // C2ME already carries a newer MixinSquared, JarJar keeps that one and ours is dropped.
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge")) {
        version {
            require "[${mixinsquared_version},)"
            prefer "${mixinsquared_version}"
        }
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The loader-bound tests are shared with the fabric module: written once next to the code they cover, run under
// each loader's own JUnit launcher.
sourceSets.test.java.srcDir '../common/src/loaderTest/java'

test {
    useJUnitPlatform()
    // The math this jar ships is tested in common; the loader suite alone would let a red common through.
    dependsOn(':common:test')
}

// FML extracts the outer artifact's jar-in-jar modules on the test runtime itself; the unpacked jars serve compile only.
configurations {
    c2meModules
}

dependencies {
    c2meModules "maven.modrinth:c2me-neoforge:${c2me_version}"
    testRuntimeOnly "maven.modrinth:c2me-neoforge:${c2me_version}"
}

var c2meModuleJars = tasks.register('unpackC2meModules', Sync) {
    from(zipTree(configurations.c2meModules.singleFile)) {
        include 'META-INF/jars/c2me-*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('c2me-modules')
}

dependencies {
    testCompileOnly files(c2meModuleJars).asFileTree.matching { include '*.jar' }
}

// The test runtime has no JarJar to drop one of the two MixinSquared copies, and the launcher refuses the duplicate.
configurations.testRuntimeClasspath {
    exclude group: 'com.github.bawnorton.mixinsquared'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modIngameVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
