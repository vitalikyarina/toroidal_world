# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.2.0.59
# NeoForm (vanilla Mojmap) pin for the loader-free 'common' module; read from the neoforge userdev config of neo_version.
neoform_version=26.2-2
# Mixin + MixinExtras for common's compileOnly classpath вЂ” the same versions the neo_version userdev config ships.
mixin_version=0.17.3+mixin.0.8.7
mixinextras_version=0.5.4
# MixinSquared вЂ” reaching C2ME's own mixin handlers from the compat module. Bundled by both loader builds as a floor,
# never a pin: C2ME ships its own copy and the higher version wins.
mixinsquared_version=0.3.7-beta.3
# C2ME (compileOnly compat, Modrinth maven version id) вЂ” the chunk-system compat mixins name its types in their
# signatures. The published jar carries no classes of its own, so its inner module jars are unpacked at build time;
# nothing is bundled, at runtime the classes come from the C2ME the player installed.
c2me_version=0.4.2-alpha.0.96+26.2

# Fabric side: Loom (build plugin), Loader, and the Fabric API build for this game version вЂ” pinned from maven.fabricmc.net.
# The 26.x no-mappings mode lives in the 1.17 snapshots вЂ” the line Fabric's own example mod pins for 26.2.
fabric_loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.3
fabric_api_version=0.157.0+26.2
# Aligned with the junit-bom that FML's junit launcher (junit-fml) imports.
junit_version=5.13.4
# JourneyMap plugin API (compileOnly compat) вЂ” the version the installed JourneyMap bundles as its jarjar API.
journeymap_api_version=26.2-2.0.0
# JourneyMap itself (compileOnly compat, Modrinth maven version id) вЂ” the API jar carries no client internals, and the
# render mixins name them in their signatures; the neoforge flavor is the unobfuscated one, so it serves fabric too.
journeymap_version=26.2-6.0.5+neoforge
# Xaero's Minimap + World Map (compileOnly compat, Modrinth maven version ids) вЂ” no API jars exist, the full
# neoforge jars are compiled against; 26.x is unobfuscated so they serve the fabric module too.
xaero_minimap_version=neoforge-26.2-26.4.2
xaero_worldmap_version=neoforge-26.2-1.44.2
# Distant Horizons (compileOnly compat, Modrinth maven version number) — one jar serves both loaders and is
# unobfuscated on 26.x, so it is compiled against as-is; the storage-fold mixins name its repository types.
distanthorizons_version=3.2.0-b-26.2

## Mod Properties

# The license of the mod.
mod_license=MIT
# The group ID for the mod. Matches the base package of the sources.
mod_group_id=com.toroidalworld
# The mod version. See https://semver.org/
toroidal_world_version=0.15.0
toroidal_world_build=dev.55
