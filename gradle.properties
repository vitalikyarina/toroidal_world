org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
# NeoForm (vanilla Mojmap) pin for the loader-free 'common' module; read from the neoforge userdev config of neo_version.
neoform_version=1.21.1-20240808.144430
# Mixin + MixinExtras for common's compileOnly classpath — the same versions the neo_version userdev config ships.
mixin_version=0.15.2+mixin.0.8.7
mixinextras_version=0.5.3
# MixinSquared — reaching C2ME's own mixin handlers from the compat module. Bundled by both loader builds as a floor,
# never a pin: C2ME ships its own copy and the higher version wins.
mixinsquared_version=0.3.7-beta.3
# The @Nullable the sources use. On the 26.x line vanilla brought it transitively; 1.21.1 ships jsr305 instead, so it
# has to be declared.
jspecify_version=1.0.0
# C2ME (compileOnly compat, Modrinth maven version id) — the chunk-system compat mixins name its types in their
# signatures. The published jar carries no classes of its own, so its inner module jars are unpacked at build time.
# The neoforge flavor serves both loader modules: it is the Mojmap one, and this line's fabric module compiles
# against Mojmap names too.
c2me_version=0.4.0-alpha.0.120+1.21.1

# Loom's current line; on 1.21.x it runs in mappings mode (officialMojangMappings) rather than the 26.x no-mappings one.
fabric_loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.3
fabric_api_version=0.116.15+1.21.1
# Aligned with the junit-bom that FML's junit launcher (junit-fml) imports.
junit_version=5.13.4
# JourneyMap plugin API (compileOnly compat) — the version the installed JourneyMap bundles as its jarjar API.
journeymap_api_version=2.0.0-1.21.1
# JourneyMap itself (compileOnly compat, Modrinth maven version number) — the API jar carries no client
# internals, and the render and grid mixins name them in their signatures. 1.21.1 needs both flavors: the
# neoforge one is Mojmap and serves common, the fabric module takes the fabric one through modCompileOnly.
journeymap_version=1.21.1-6.0.7+neoforge
journeymap_fabric_version=1.21.1-6.0.7+fabric
# The oldest JourneyMap this mod supports; below it the loaders refuse the game.
journeymap_min_version=1.21.1-6.0.5
# Xaero's Minimap + World Map (compileOnly compat, Modrinth maven version ids) — no API jars exist, the full
# jars are compiled against. The common module reads the neoforge flavor (NeoForge 1.21.1 runs on Mojmap, matching
# NeoForm's names); the fabric module needs the fabric flavor through modCompileOnly — Loom remaps it to the
# workspace names, which is also what lets remapJar resolve GuiMap's Screen.render override back to intermediary.
xaero_minimap_version=neoforge-1.21.1-26.4.2
xaero_worldmap_version=neoforge-1.21.1-1.44.2
xaero_minimap_fabric_version=fabric-1.21.1-26.4.2
xaero_worldmap_fabric_version=fabric-1.21.1-1.44.2
# Distant Horizons (compileOnly compat, Modrinth maven version number) — one jar carries both loaders' builds. The
# storage-fold mixins name DH's own core types, which carry no game names; its chunk wrapper is the exception and
# ships once per loader, so ChunkWrapperMixin names both spellings.
distanthorizons_version=3.2.0-b-1.21.1
# Create (compileOnly compat, Modrinth maven version id) — the seam folds name its types. Only a neoforge flavor
# exists: Create publishes no Fabric build on this game version at all, the Fabric port stopped at 1.20.1. So the one
# jar serves both modules as plain compileOnly, with nothing to remap on the fabric side, and the compat gate there
# reads false for good.
create_version=6.0.10+mc1.21.1
# Sable (compileOnly compat, Modrinth maven version IDS, not numbers — both loader jars publish the same number
# 2.0.5+mc1.21.1, so only the id tells them apart). The foreign-frame source reads the level's plot container. The
# common module reads the neoforge flavor (Mojmap); the fabric module takes the fabric flavor through modCompileOnly,
# as the Xaero jars do.
sable_version=U678xqle
sable_fabric_version=e11C0I1A
# Create Aeronautics (compileOnly compat, Modrinth maven version number) — the payload rewriters name the bundle's
# types. The published jar is a container carrying no classes of its own, only three jar-in-jar mods, so the two the
# rewriters name are unpacked at build time. NeoForge only on this game line; the fabric module compiles the same
# sources, and its gates read false at runtime.
aeronautics_version=1.3.2+mc1.21.1
# FTB Chunks and its GUI library (compileOnly compat, FTB's own maven — the mods are not published on Modrinth).
# Each loader gets its own artifact id, so the version number alone tells the two builds apart. ftb-library carries
# the Panel/Widget types the map screens extend, so the map mixins do not resolve without it. The common module
# reads the neoforge flavor (Mojmap); the fabric module takes the fabric flavor through modCompileOnly, as the Xaero
# jars do.
ftbchunks_version=2101.1.22
ftblibrary_version=2101.1.35
# The oldest FTB Chunks this mod supports; below it the loaders refuse the game. The map folds inject into private
# members and one lambda of the client, and an older build spells them differently.
ftbchunks_min_version=2101.1.22

## Mod Properties

mod_license=MIT
mod_group_id=com.toroidalworld
toroidal_world_version=0.16.3
toroidal_world_build=v.25
