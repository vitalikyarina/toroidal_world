# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.248
# NeoForm (vanilla Mojmap) pin for the loader-free 'common' module; read from the neoforge userdev config of neo_version.
neoform_version=1.21.1-20240808.144430
# Mixin + MixinExtras for common's compileOnly classpath — the same versions the neo_version userdev config ships.
mixin_version=0.15.2+mixin.0.8.7
mixinextras_version=0.5.3
# MixinSquared — reaching C2ME's own mixin handlers from the compat module. Bundled by both loader builds as a floor,
# never a pin: C2ME ships its own copy and the higher version wins.
mixinsquared_version=0.3.7-beta.3
# The @Nullable the sources use. On the 26.x line vanilla brought it transitively; 1.21.1 ships jsr305 instead, so it
# has to be declared.
jspecify_version=1.0.0
# C2ME (compileOnly compat, Modrinth maven version id) — the chunk-system compat mixins name its types in their
# signatures. The published jar carries no classes of its own, so its inner module jars are unpacked at build time;
# nothing is bundled, at runtime the classes come from the C2ME the player installed. The neoforge flavor serves both
# loader modules: it is the Mojmap one, and this line's fabric module compiles against Mojmap names too.
c2me_version=0.4.0-alpha.0.120+1.21.1

# Fabric side: Loom (build plugin), Loader, and the Fabric API build for this game version — pinned from maven.fabricmc.net.
# Loom's current line; on 1.21.x it runs in mappings mode (officialMojangMappings) rather than the 26.x no-mappings one.
fabric_loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.3
fabric_api_version=0.116.15+1.21.1
# Aligned with the junit-bom that FML's junit launcher (junit-fml) imports.
junit_version=5.13.4
# JourneyMap plugin API (compileOnly compat) — the version the installed JourneyMap bundles as its jarjar API.
journeymap_api_version=2.0.0-1.21.1
# Xaero's Minimap + World Map (compileOnly compat, Modrinth maven version ids) — no API jars exist, the full
# jars are compiled against. The common module reads the neoforge flavor (NeoForge 1.21.1 runs on Mojmap, matching
# NeoForm's names); the fabric module needs the fabric flavor through modCompileOnly — Loom remaps it to the
# workspace names, which is also what lets remapJar resolve GuiMap's Screen.render override back to intermediary.
xaero_minimap_version=neoforge-1.21.1-26.4.2
xaero_worldmap_version=neoforge-1.21.1-1.44.2
xaero_minimap_fabric_version=fabric-1.21.1-26.4.2
xaero_worldmap_fabric_version=fabric-1.21.1-1.44.2
# Create (compileOnly compat, Modrinth maven version id) — the seam folds name its types. Only a neoforge flavor
# exists: Create publishes no Fabric build on this game version at all, the Fabric port stopped at 1.20.1. So the one
# jar serves both modules as plain compileOnly, with nothing to remap on the fabric side, and the compat gate there
# reads false for good.
create_version=6.0.10+mc1.21.1

## Mod Properties

# The license of the mod.
mod_license=MIT
# The group ID for the mod. Matches the base package of the sources.
mod_group_id=com.toroidalworld
# The mod version. See https://semver.org/
toroidal_world_version=0.14.0
