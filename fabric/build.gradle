plugins {
    id 'net.fabricmc.fabric-loom-remap'
    id 'idea'
}

ext {
    mod_id = 'toroidal_world'
}

version = toroidal_world_version
group = mod_group_id

def withBuildSuffix = { baseVersion ->
    def buildSuffix = findProperty("${mod_id}_build")
    buildSuffix ? "${baseVersion}-${buildSuffix}" : baseVersion
}
def modIngameVersion = withBuildSuffix(toroidal_world_version)
def jarVersion = withBuildSuffix("${toroidal_world_version}+mc${minecraft_version}")

base {
    archivesName = mod_id
}

// 1.21.1 runs on Java 21 — that is what NeoForge 21.1.x and its Fabric contemporaries are built against.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Common's sources compile HERE, not as a project dependency, so the fabric jar carries every class and Loom sees the
// mixin sources. 1.21.x Minecraft is obfuscated, so unlike the 26.x line this needs mappings and a remapped jar.
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

sourceSets.main.resources {
    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
}

loom {
    accessWidenerPath = file('src/main/resources/toroidal_world.accesswidener')
}

repositories {
    // JourneyMap API mirror (TeamJM's own maven is flaky). Needed here too: common's sources compile in this module.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    // Xaero's Minimap / World Map and Create jars for the compat mixins.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // MixinSquared — the C2ME compat mixin injects into C2ME's own handler.
    maven {
        name = 'Bawnorton'
        url = 'https://maven.bawnorton.com/releases'
        content {
            includeGroup 'com.github.bawnorton.mixinsquared'
        }
    }
}

// Same unpack as in common, for the same reason: common's sources compile in this module too, and the chunk-system
// compat mixins name C2ME types. compileOnly on both sides — the classes come from the installed C2ME at runtime.
configurations {
    c2meModules
}

dependencies {
    c2meModules "maven.modrinth:c2me-neoforge:${c2me_version}"
}

var c2meModuleJars = tasks.register('unpackC2meModules', Sync) {
    from(zipTree(configurations.c2meModules.singleFile)) {
        include 'META-INF/jars/c2me-*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('c2me-modules')
}

// Same unpack as in common, for the same reason: Ponder rides jar-in-jar inside the Create jar, and without its
// VirtualBlockEntity on the classpath no member of a Create block entity resolves. Plain compileOnly and the neoforge
// flavor, like the Create jar beside it — there is nothing here for Loom to remap.
configurations {
    createJarJar
}

dependencies {
    createJarJar "maven.modrinth:create:${create_version}"
}

var createPonderJar = tasks.register('unpackCreatePonder', Sync) {
    from(zipTree(configurations.createJarJar.singleFile)) {
        include 'META-INF/jarjar/ponder-*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('create-ponder')
}

dependencies {
    compileOnly files(c2meModuleJars).asFileTree.matching { include '*.jar' }
    compileOnly files(createPonderJar).asFileTree.matching { include '*.jar' }
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojmap on both sides: the mixins and the accesswidener are written against the same names NeoForge uses,
    // so common's sources compile unchanged for either loader.
    mappings loom.officialMojangMappings()
    // modImplementation, not implementation: only the mod configurations run through Loom's dependency provider, which
    // remaps these jars off intermediary and applies the loader's fabric-installer.json (mixin, asm). Plain
    // implementation was equivalent on the unobfuscated 26.x line and silently drops both here.
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "org.jspecify:jspecify:${jspecify_version}"

    // Bundled into the jar for production. No annotation processor and no refmap: Loom 1.17 defaults
    // useLegacyMixinAp to false and remaps the mixin annotations inside remapJar instead.
    include(implementation("io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"))

    // Bundled rather than borrowed from C2ME's own jar-in-jar: that copy is C2ME's implementation detail, and leaning
    // on it would make the fold vanish the day C2ME drops or renames it. Loader JiJ keeps the highest version present,
    // so shipping ours costs nothing where C2ME already carries a newer one.
    include(implementation("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixinsquared_version}"))

    // NeoForge 1.21.1 runs on Mojmap, so the neoforge API flavor already speaks this workspace's names — plain
    // compileOnly, nothing to remap off intermediary. remapJar bridges the runtime gap the other way.
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"
    // The Xaero jars ride modCompileOnly as the FABRIC flavor: Loom remaps them off intermediary onto this
    // workspace's names AND puts them on remapJar's classpath — without that, GuiMap does not resolve to Screen and
    // the mixin target for its render override never becomes method_25394 in the shipped jar.
    modCompileOnly "maven.modrinth:xaeros-minimap:${xaero_minimap_fabric_version}"
    modCompileOnly "maven.modrinth:xaeros-world-map:${xaero_worldmap_fabric_version}"
    // Needed here only because common's sources compile in this module. Plain compileOnly, and the neoforge flavor:
    // there is no fabric flavor of Create to remap, and none is wanted — Create cannot be installed on this loader,
    // so the compat config stays gated off and remapJar has nothing to resolve.
    compileOnly "maven.modrinth:create:${create_version}"
}

// Two jars on this game version, and only the second one ships. Minecraft is obfuscated here, so Loom compiles into a
// dev jar under build/devlibs and remaps that into build/libs — naming jar alone leaves the shipped artifact on Loom's
// default name, which is neither the loader nor the game version, and a deploy that matches on the name then picks up
// whatever older build still lies beside it. On the 26.x line there was no remap step and jar was the artifact.
tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-fabric-${jarVersion}-dev.jar"
}

tasks.named('remapJar', AbstractArchiveTask) {
    archiveFileName = "${mod_id}-fabric-${jarVersion}.jar"
}

processResources {
    inputs.property 'version', modIngameVersion
    filesMatching('fabric.mod.json') {
        expand version: modIngameVersion
    }
    // The NeoForge AT rides along in common's resources; the fabric jar carries the accesswidener instead.
    exclude 'META-INF/accesstransformer.cfg'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
